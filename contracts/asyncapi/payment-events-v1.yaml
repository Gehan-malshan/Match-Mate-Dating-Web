asyncapi: 3.0.0
info: { title: MatchMate Payment Events, version: 1.0.0 }
channels:
  paymentFacts:
    address: matchmate.payment.v1
    messages:
      paymentInitiated: { $ref: '#/components/messages/PaymentInitiated' }
      paymentCompleted: { $ref: '#/components/messages/PaymentCompleted' }
      paymentFailed: { $ref: '#/components/messages/PaymentFailed' }
      paymentReviewRequired: { $ref: '#/components/messages/PaymentReviewRequired' }
operations:
  publishPaymentFacts:
    action: send
    channel: { $ref: '#/channels/paymentFacts' }
components:
  messages:
    PaymentInitiated: { name: PaymentInitiated, payload: { $ref: '#/components/schemas/PaymentFact' } }
    PaymentCompleted: { name: PaymentCompleted, payload: { $ref: '#/components/schemas/PaymentFact' } }
    PaymentFailed: { name: PaymentFailed, payload: { $ref: '#/components/schemas/PaymentFact' } }
    PaymentReviewRequired: { name: PaymentReviewRequired, payload: { $ref: '#/components/schemas/PaymentFact' } }
  schemas:
    PaymentFact:
      type: object
      additionalProperties: false
      required: [eventId, eventType, schemaVersion, occurredAt, aggregateId, correlationId, actorId, payload]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string, enum: [PaymentInitiated, PaymentCompleted, PaymentFailed, PaymentReviewRequired] }
        schemaVersion: { type: integer, const: 1 }
        occurredAt: { type: string, format: date-time }
        aggregateId: { type: string, format: uuid }
        correlationId: { type: string, format: uuid }
        causationId: { type: [string, 'null'], format: uuid }
        actorId: { type: string }
        payload:
          type: object
          additionalProperties: false
          required: [paymentId, bookingId, amount, currency]
          properties:
            paymentId: { type: string, format: uuid }
            bookingId: { type: string, format: uuid }
            amount: { type: string, pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$' }
            currency: { type: string, pattern: '^[A-Z]{3}$' }

