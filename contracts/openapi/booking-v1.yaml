openapi: 3.1.0
info: {title: MatchMate Booking API, version: 1.0.0}
servers: [{url: /api/v1}]
paths:
  /bookings:
    get:
      summary: List the authenticated member's bookings
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Booking list, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/Booking"}}}}}}}
        "401": {$ref: "#/components/responses/Problem"}
    post:
      summary: Atomically reserve event capacity and create a payment hold
      security: [{bearerAuth: []}]
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [eventId], properties: {eventId: {type: string, format: uuid}}}}}}
      responses:
        "201": {description: Booking hold, content: {application/json: {schema: {$ref: "#/components/schemas/Booking"}}}}
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /bookings/{bookingId}:
    get:
      summary: Read the authenticated member's booking
      security: [{bearerAuth: []}]
      parameters: [{name: bookingId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Booking, content: {application/json: {schema: {$ref: "#/components/schemas/Booking"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /bookings/{bookingId}/cancel:
    post:
      summary: Cancel and release an active unpaid hold
      security: [{bearerAuth: []}]
      parameters:
        - {name: bookingId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      responses:
        "200": {description: Cancelled booking, content: {application/json: {schema: {$ref: "#/components/schemas/Booking"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  responses: {Problem: {description: Problem details, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}}
  schemas:
    Booking:
      type: object
      required: [bookingId,eventId,state,amount,currency,policyVersion,expiresAt,version,createdAt]
      properties:
        bookingId: {type: string, format: uuid}
        eventId: {type: string, format: uuid}
        state: {type: string, enum: [PENDING_PAYMENT,CONFIRMED,EXPIRED,CANCELLED,PAYMENT_REVIEW]}
        amount: {type: string, pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        policyVersion: {type: integer, format: int64}
        expiresAt: {type: string, format: date-time}
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        confirmedAt: {type: string, format: date-time}
        cancelledAt: {type: string, format: date-time}
    Problem: {type: object, required: [type,title,status,code,detail,traceId], properties: {type: {type: string}, title: {type: string}, status: {type: integer}, code: {type: string}, detail: {type: string}, traceId: {type: string}}}
