name: matchmate-notification
services:
  postgres-notification:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: matchmate_notification
      POSTGRES_USER: matchmate
      POSTGRES_PASSWORD: matchmate
    ports: ["5438:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchmate -d matchmate_notification"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["notification-postgres:/var/lib/postgresql/data"]

  notification-migrate:
    image: matchmate/notification-service:development
    build: {context: ../../services/notification-service}
    entrypoint: ["/notification-migrate"]
    environment: &notification-environment
      APP_ENV: development
      NOTIFICATION_DATABASE_URL: postgres://matchmate:matchmate@postgres-notification:5432/matchmate_notification?sslmode=disable
      NOTIFICATION_RABBITMQ_URL: amqp://matchmate:matchmate@host.docker.internal:5672/
      NOTIFICATION_EVENT_EXCHANGE: matchmate.events
      NOTIFICATION_PROVIDER: dev-sink
      NOTIFICATION_DEFAULT_LOCALE: en-LK
      NOTIFICATION_MAX_ATTEMPTS: "5"
      NOTIFICATION_POLL_INTERVAL: 1s
      NOTIFICATION_LEASE_DURATION: 30s
      NOTIFICATION_RETRY_BASE: 1m
    depends_on:
      postgres-notification: {condition: service_healthy}
    restart: "no"

  notification-api:
    image: matchmate/notification-service:development
    build: {context: ../../services/notification-service}
    environment: *notification-environment
    ports: ["8086:8086"]
    depends_on:
      notification-migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  notification-consumer:
    image: matchmate/notification-service:development
    build: {context: ../../services/notification-service}
    entrypoint: ["/notification-consumer"]
    environment: *notification-environment
    depends_on:
      notification-migrate: {condition: service_completed_successfully}
    restart: on-failure

  notification-worker:
    image: matchmate/notification-service:development
    build: {context: ../../services/notification-service}
    entrypoint: ["/notification-worker"]
    environment: *notification-environment
    depends_on:
      notification-migrate: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  notification-postgres:

