name: matchmate-account
services:
  postgres-account:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: matchmate_account
      POSTGRES_USER: matchmate
      POSTGRES_PASSWORD: matchmate
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchmate -d matchmate_account"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["account-postgres:/var/lib/postgresql/data"]
  account-migrate:
    image: matchmate/account-service:development
    build:
      context: ../../services/account-service
    entrypoint: ["/account-migrate"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://matchmate:matchmate@postgres-account:5432/matchmate_account?sslmode=disable
    depends_on:
      postgres-account:
        condition: service_healthy
    restart: "no"
  account-seed:
    image: matchmate/account-service:development
    build:
      context: ../../services/account-service
    entrypoint: ["/account-seed-dev"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://matchmate:matchmate@postgres-account:5432/matchmate_account?sslmode=disable
      CURRENT_CONSENT_VERSION: privacy-2026-08
    depends_on:
      account-migrate:
        condition: service_completed_successfully
    restart: "no"
  account-api:
    image: matchmate/account-service:development
    build:
      context: ../../services/account-service
    entrypoint: ["/account-api"]
    environment:
      APP_ENV: development
      HTTP_ADDRESS: :8081
      DATABASE_URL: postgres://matchmate:matchmate@postgres-account:5432/matchmate_account?sslmode=disable
      JWT_ISSUER: matchmate-account
      JWT_AUDIENCE: matchmate-api
      JWT_KEY_ID: account-compose-dev-1
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      COOKIE_SECURE: "false"
      DEV_EXPOSE_VERIFICATION_TOKEN: "true"
      CURRENT_CONSENT_VERSION: privacy-2026-08
    ports: ["8081:8081"]
    depends_on:
      account-seed:
        condition: service_completed_successfully
    restart: unless-stopped
  account-outbox:
    image: matchmate/account-service:development
    build:
      context: ../../services/account-service
    entrypoint: ["/account-outbox"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://matchmate:matchmate@postgres-account:5432/matchmate_account?sslmode=disable
      RABBITMQ_URL: amqp://matchmate:matchmate@rabbitmq:5672/
      EVENT_EXCHANGE: matchmate.events
    depends_on:
      account-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: matchmate
      RABBITMQ_DEFAULT_PASS: matchmate
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 20s
      start_period: 30s
      retries: 30
    restart: unless-stopped
volumes:
  account-postgres:
