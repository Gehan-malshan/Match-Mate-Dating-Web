name: matchmate-event
services:
  postgres-event:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: matchmate_event
      POSTGRES_USER: matchmate
      POSTGRES_PASSWORD: matchmate
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchmate -d matchmate_event"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["event-postgres:/var/lib/postgresql/data"]
  event-migrate:
    image: matchmate/event-service:development
    build:
      context: ../../services/event-service
    entrypoint: ["/event-migrate"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://matchmate:matchmate@postgres-event:5432/matchmate_event?sslmode=disable
    depends_on:
      postgres-event:
        condition: service_healthy
    restart: "no"
  event-api:
    image: matchmate/event-service:development
    build:
      context: ../../services/event-service
    environment:
      APP_ENV: development
      HTTP_ADDRESS: :8082
      DATABASE_URL: postgres://matchmate:matchmate@postgres-event:5432/matchmate_event?sslmode=disable
      ACCOUNT_JWKS_URL: http://host.docker.internal:8081/.well-known/jwks.json
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174
    ports: ["8082:8082"]
    depends_on:
      event-migrate:
        condition: service_completed_successfully
    profiles: ["api"]
  event-outbox-relay:
    image: matchmate/event-service:development
    build:
      context: ../../services/event-service
    entrypoint: ["/event-outbox-relay"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://matchmate:matchmate@postgres-event:5432/matchmate_event?sslmode=disable
      RABBITMQ_URL: amqp://matchmate:matchmate@host.docker.internal:5672/
      EVENT_EXCHANGE: matchmate.events
    depends_on:
      event-migrate:
        condition: service_completed_successfully
    restart: on-failure
    profiles: ["messaging"]
volumes:
  event-postgres:
